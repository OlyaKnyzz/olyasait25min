  <!-- флакон витамина -->
  <g>
    <ellipse cx="331" cy="412" rx="88" ry="16" fill="#b77e41" opacity=".22" filter="url(#shadow)"/>
    <rect x="286" y="169" width="100" height="41" rx="10" fill="#fffaf0" stroke="#efd4a8" stroke-width="3"/>
    <rect x="297" y="145" width="78" height="37" rx="8" fill="#f7f0df" stroke="#e8d2ad" stroke-width="3"/>
    <path d="M306 145v-12c0-6 5-11 11-11h38c6 0 11 5 11 11v12" fill="#f1b35b"/>
    <path d="M289 202c0-12 10-22 22-22h50c12 0 22 10 22 22v177c0 17-14 31-31 31h-32c-17 0-31-14-31-31V202Z" fill="url(#bottle)"/>
    <path d="M299 220c28-11 62-11 88 0" stroke="#ffc979" stroke-width="4" opacity=".5" fill="none"/>
    <rect x="302" y="259" width="68" height="102" rx="9" fill="#fff9ed"/>
    <circle cx="336" cy="286" r="14" fill="#ffcb61"/>
    <path d="M336 272v-5M336 305v-5M322 286h-5M355 286h-5M326 276l-4-4M350 300l-4-4M346 276l4-4M326 300l-4 4" stroke="#f2a52e" stroke-width="2.8" stroke-linecap="round"/>
    <text x="336" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#6d4d2f" text-anchor="middle" letter-spacing=".5">VITAMIN</text>
    <text x="336" y="339" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#dd852c" text-anchor="middle">D3</text>
    <path d="M318 350h36" stroke="#e7cba1" stroke-width="2" stroke-linecap="round"/>
    <path d="M300 205v164" stroke="#fff" stroke-width="8" opacity=".18" stroke-linecap="round"/>
  </g>

  <!-- ложка с каплями -->
  <g>
    <path d="M438 420c28-10 56-11 82-2" fill="none" stroke="#dab98c" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="526" cy="421" rx="21" ry="10" fill="#f7e2b9" stroke="#dab98c" stroke-width="3"/>
    <ellipse cx="526" cy="419" rx="12" ry="5" fill="#ffc453"/>
    <circle cx="380" cy="427" r="7" fill="#ffc453"/>
    <circle cx="401" cy="437" r="5" fill="#ffcf68"/>
    <circle cx="414" cy="421" r="4" fill="#ffc453"/>
  </g>

  <!-- деревянный зайчик -->
  <g transform="translate(150 324)">
    <ellipse cx="54" cy="94" rx="47" ry="12" fill="#b77e41" opacity=".22" filter="url(#shadow)"/>
    <path d="M30 41C24 12 31-1 41 0c10 1 12 17 11 39" fill="#d9a76d" stroke="#c18d55" stroke-width="3"/>
    <path d="M58 40C60 13 70 1 79 3c9 3 7 18 1 40" fill="#d9a76d" stroke="#c18d55" stroke-width="3"/>
    <ellipse cx="54" cy="64" rx="39" ry="35" fill="#e3b77e" stroke="#c18d55" stroke-width="3"/>
    <circle cx="54" cy="40" r="27" fill="#e8c08b" stroke="#c18d55" stroke-width="3"/>
    <circle cx="44" cy="36" r="3.6" fill="#564032"/>
    <circle cx="65" cy="36" r="3.6" fill="#564032"/>
    <path d="M50 47c3 2 6 2 9 0" stroke="#9c6741" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M48 48c-8 1-15-1-20-5M61 48c8 1 15-1 20-5" stroke="#c18d55" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 69c-11-5-16-14-12-20 4-5 11-3 17 4M88 69c11-5 16-14 12-20-4-5-11-3-17 4" fill="#e8c08b" stroke="#c18d55" stroke-width="3"/>
    <path d="M43 84c7 4 15 4 22 0" stroke="#c18d55" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- текстура/свет -->
  <g fill="#fff">
    <circle cx="114" cy="310" r="3" opacity=".6"/>
    <circle cx="724" cy="331" r="4" opacity=".5"/>
    <circle cx="500" cy="112" r="2.5" opacity=".6"/>
    <path d="M92 344c25-9 49-12 73-8" stroke="#fff8e8" stroke-width="4" stroke-linecap="round" opacity=".6"/>
  </g>
</svg>
