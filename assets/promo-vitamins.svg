  <g>
    <path d="M655 378c-4-44 17-82 57-101 14 38 3 82-33 108" fill="#86c09d"/>
    <path d="M662 382c-23-26-59-31-89-15 13 31 48 48 83 39" fill="#a5d2b5"/>
