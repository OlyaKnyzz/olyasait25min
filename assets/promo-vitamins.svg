<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
  <title id="t">Витамин D и полезный завтрак</title>
  <desc id="d">На светлом столе стоит флакон витамина D, стакан апельсинового сока, фрукты и деревянная игрушка.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffaf0"/><stop offset="1" stop-color="#ffedc7"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff2c7" stop-opacity=".9"/><stop offset="1" stop-color="#ffe3a2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottle" x1="310" y1="180" x2="420" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2a94e"/><stop offset="1" stop-color="#df8530"/>
    </linearGradient>
    <linearGradient id="juice" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffb141"/><stop offset="1" stop-color="#f28b21"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="360" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6d9a9"/><stop offset="1" stop-color="#e9c087"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="800" height="520" fill="url(#bg)"/>
  <circle cx="694" cy="88" r="170" fill="#ffe7a6" opacity=".38"/>
  <path d="M0 0h800v360H0z" fill="url(#bg)"/>
  <path d="M0 0h800v360H0z" fill="url(#sun)" opacity=".55"/>

  <!-- окно и свет -->
  <g>
    <rect x="472" y="38" width="248" height="250" rx="18" fill="#fffdf5" stroke="#efd8aa" stroke-width="3"/>
    <rect x="485" y="51" width="222" height="224" rx="10" fill="#cdefff"/>
    <path d="M596 51v224M485 163h222" stroke="#fffdf5" stroke-width="8"/>
    <circle cx="663" cy="98" r="27" fill="#ffe08a"/>
    <path d="M518 127c6-13 22-18 34-11 6-10 19-15 30-10 14 6 19 22 12 35h-76c-3-5-1-9 0-14Z" fill="#fff" opacity=".85"/>
    <path d="M612 250c38 26 69 55 91 87" stroke="#fff6dc" stroke-width="22" opacity=".38" stroke-linecap="round"/>
    <path d="M626 238c20 19 40 40 59 65" stroke="#fff6dc" stroke-width="8" opacity=".45" stroke-linecap="round"/>
    <path d="M490 288h178" stroke="#efd8aa" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- полка -->
  <g opacity=".85">
    <rect x="56" y="208" width="256" height="10" rx="5" fill="#ecd5aa"/>
    <rect x="80" y="143" width="45" height="65" rx="8" fill="#fff" stroke="#efdfc2"/>
    <rect x="90" y="132" width="25" height="15" rx="4" fill="#9dd2e9"/>
    <rect x="145" y="160" width="33" height="48" rx="6" fill="#b6d9b7"/>
    <path d="M153 169h17M153 177h13M153 185h15" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M214 208v-18c0-13 10-23 23-23s23 10 23 23v18" fill="#f3b1ac" opacity=".85"/>
    <path d="M237 167c-11 0-20-9-20-20 0-8 4-14 10-18 3 8 10 13 18 14-1 11-8 18-18 18" fill="#7cbf9d"/>
  </g>

  <!-- стол -->
  <path d="M0 356h800v164H0z" fill="url(#table)"/>
  <path d="M0 356h800" stroke="#e7c38d" stroke-width="3"/>
  <path d="M0 360h800v8H0z" fill="#fff8e8" opacity=".55"/>
  <ellipse cx="397" cy="430" rx="265" ry="35" fill="#c99255" opacity=".18" filter="url(#shadow)"/>

