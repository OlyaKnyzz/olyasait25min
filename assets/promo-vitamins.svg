  <g>
    <ellipse cx="575" cy="401" rx="55" ry="15" fill="#b77e41" opacity=".2" filter="url(#shadow)"/>
    <circle cx="556" cy="363" r="43" fill="#f39b2e"/>
    <circle cx="556" cy="363" r="34" fill="#ffbd52"/>
    <path d="M556 329v68M522 363h68M532 339l48 48M580 339l-48 48" stroke="#ffdc8b" stroke-width="4" opacity=".9"/>
    <circle cx="556" cy="363" r="7" fill="#fff2c8"/>
    <circle cx="595" cy="382" r="31" fill="#f09128"/>
    <circle cx="595" cy="382" r="23" fill="#ffbb4d"/>
    <path d="M595 359v46M572 382h46M579 366l32 32M611 366l-32 32" stroke="#ffdd8e" stroke-width="3.5" opacity=".85"/>
    <path d="M546 311c11-6 25-3 34 6 9-9 24-10 35-3-8 14-23 21-39 17-12-2-23-9-30-20Z" fill="#7dbb82"/>
  </g>

  <!-- стакан сока -->
  <g>
    <ellipse cx="465" cy="410" rx="54" ry="13" fill="#b77e41" opacity=".2" filter="url(#shadow)"/>
    <path d="M421 251h87l-12 150c-1 9-9 16-18 16h-27c-9 0-17-7-18-16l-12-150Z" fill="#fff" opacity=".55" stroke="#f4d9ae" stroke-width="3"/>
    <path d="M430 292h68l-8 106c-1 8-7 13-15 13h-22c-8 0-14-5-15-13l-8-106Z" fill="url(#juice)"/>
