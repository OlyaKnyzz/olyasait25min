    <g fill="#34363d"><ellipse cx="528" cy="288" rx="3.4" ry="4"/><ellipse cx="552" cy="288" rx="3.4" ry="4"/></g>
    <path d="M521 281c3-2 7-2 10 0M548 280c3-2 7-2 10 0" stroke="#604735" stroke-width="2" stroke-linecap="round"/>
    <path d="M533 301c4 3 9 3 13 0" stroke="#b96667" stroke-width="2.7" stroke-linecap="round"/>
    <path d="M519 334c-10 16-12 35-6 54" fill="none" stroke="#ffcf6e" stroke-width="19" stroke-linecap="round"/>
    <path d="M515 386c12 13 24 22 38 27" fill="none" stroke="#e8b695" stroke-width="14" stroke-linecap="round"/>
    <path d="M551 405c7 3 11 8 12 14" fill="none" stroke="#e8b695" stroke-width="13" stroke-linecap="round"/>
    <path d="M565 418c7 1 11 6 10 12-1 6-6 9-11 8-5-1-8-5-8-10" fill="#e8b695"/>
    <path d="M564 328c17 4 29 13 36 26" fill="none" stroke="#ffcf6e" stroke-width="19" stroke-linecap="round"/>
    <path d="M598 352c8 7 13 15 15 24" fill="none" stroke="#e8b695" stroke-width="14" stroke-linecap="round"/>
    <path d="M520 504h50M531 477h34" stroke="#fff" stroke-width="3" opacity=".4"/>
  </g>

