    <circle cx="451" cy="386" r="9" fill="#ffd36e"/>
    <path d="M442 400c5-6 12-8 20-5" stroke="#dba53a" stroke-width="2.5" fill="none"/>
    <rect x="497" y="373" width="58" height="42" rx="6" fill="#fff" stroke="#e1d4c2" transform="rotate(7 526 394)"/>
