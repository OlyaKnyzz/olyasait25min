  <!-- декор -->
  <g>
    <circle cx="143" cy="122" r="4" fill="#efb2a8"/>
    <path d="M652 88v10M647 93h10" stroke="#91c7b3" stroke-width="3" stroke-linecap="round"/>
    <path d="M624 386v9M619.5 390.5h9" stroke="#efb2a8" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
