<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">Занятие с логопедом</title>
  <desc id="d">Логопед и девочка занимаются за столом с зеркалом и карточками, вокруг летят буквы.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3fbff"/><stop offset="1" stop-color="#e4f5f0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e6d6c2"/><stop offset="1" stop-color="#dac4aa"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7cc2ae"/><stop offset="1" stop-color="#59a792"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#wall)"/>
  <path d="M0 450h800v150H0z" fill="url(#floor)"/>
  <path d="M0 450h800" stroke="#d2b99d" stroke-width="3"/>
  <path d="M0 492h800M140 450l-32 150M350 450l-5 150M570 450l15 150" stroke="#d8c0a5" stroke-width="2" opacity=".6"/>

  <!-- окно -->
