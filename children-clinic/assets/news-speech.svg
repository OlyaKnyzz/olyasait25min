  <!-- маленький столик с игрушками -->
  <g>
    <rect x="140" y="372" width="68" height="10" rx="4" fill="#e9cda9"/>
    <path d="M153 382v58M195 382v58" stroke="#d0b18c" stroke-width="5" stroke-linecap="round"/>
    <rect x="149" y="336" width="17" height="36" rx="4" fill="#f3a7ad"/>
    <rect x="169" y="344" width="14" height="28" rx="4" fill="#8fcbb8"/>
    <rect x="187" y="332" width="15" height="40" rx="4" fill="#ffcf6e"/>
