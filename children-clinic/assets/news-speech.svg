    <rect x="408" y="405" width="18" height="26" rx="3" fill="#f4a7ad" transform="rotate(-14 417 418)"/>
    <rect x="436" y="410" width="18" height="26" rx="3" fill="#8fcbb8" transform="rotate(8 445 423)"/>
    <rect x="464" y="405" width="18" height="26" rx="3" fill="#ffcf6e" transform="rotate(-8 473 418)"/>
